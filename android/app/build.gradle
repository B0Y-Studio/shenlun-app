apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Autolinking (RN 0.77+ replaces the legacy
       apply from: .../@react-native-community/cli-platform-android/native_modules.gradle
       applyNativeModulesAppBuildGradle(project) pattern) */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = 'org.webkit:android-jsc-intl:+'`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.shenlunapp"
    defaultConfig {
        applicationId "com.shenlunapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        ndk {
            // 3-ABI to support phone (arm64-v8a + armeabi-v7a) + emulator (x86_64).
            // For release, drop x86_64 to save ~25MB if emulator not needed.
            abiFilters "armeabi-v7a", "arm64-v8a", "x86_64"
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // Debug doesn't need architecture restriction for emulator testing
            // but abiFilters above applies; override here for debug if needed
        }
        release {
            signingConfig signingConfigs.debug
            // Minify + shrink resources for smaller release APK
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            // M13: release 仅打包手机架构（arm64-v8a + armeabi-v7a），排除 x86_64
            // 节省约 25MB。debug 仍带 x86_64 以兼容模拟器。
            ndk {
                abiFilters 'arm64-v8a', 'armeabi-v7a'
            }
        }
    }
    packaging {
        // Don't ship duplicate vector-icon fonts; we use MaterialCommunityIcons only
        jniLibs {
            pickFirsts += [
                "**/libc++_shared.so",
                "**/libfbjni.so",
            ]
        }
    }
}

// Removed java toolchain block — uses JDK from org.gradle.java.home (JDK 17) directly.
// Prevents Gradle from trying to download JDK 17 from GitHub (which times out in China).
//
// react-native-vector-icons: ship only MaterialCommunityIcons (saves ~3MB).
// RN 0.74 autolink already applies fonts.gradle from the root project, so
// we cannot re-apply it here. Instead, we rely on manually deleting the unused
// .ttf files from the assets/fonts folder (see assets/fonts/*.ttf).
// To do: `rm node_modules/react-native-vector-icons/Fonts/{AntDesign,Entypo,EvilIcons,Feather,FontAwesome,FontAwesome5_Brands,FontAwesome5_Solid,FontAwesome6_Brands,FontAwesome6_Solid,Fontisto,Ionicons,MaterialIcons,Octicons,SimpleLineIcons,Zocial}.ttf`

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

// Autolinking now lives in `react { autolinkLibrariesWithApp() }` above
// (RN 0.77+). The legacy `apply from: .../native_modules.gradle` is gone
// because @react-native-community/cli-platform-android was removed in RN 0.77.
// react-native-vector-icons v10 ships its own autolinking (no manual
// fonts.gradle apply needed).
